.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:12px 0 6px}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

textarea{min-height:110px}

button.b.o{background:none;color:var(--pr);border:1px solid var(--pr)}button.b.r{background:var(--live);color:#fff}
.st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.st.sap{color:var(--wait)}.st.live{color:var(--live)}.st.done{color:var(--done)}

.vs b{font-size:15px}.sc{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.big{width:100%;font-size:30px;padding:18px 0;border-radius:12px}

.note{background:var(--bg);border:1px dashed var(--bd);border-radius:8px;padding:10px;font-size:14px;color:var(--mu)}

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function alert(m){toast(String(m),1)}
function ask(msg){return new Promise(res=>{const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px";o.innerHTML=`<div class="card" style="max-width:420px;margin:0"><p style="margin-top:0;white-space:pre-wrap">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="b o" id="n_">Hủy</button><button class="b" id="y_">Đồng ý</button></div></div>`;document.body.appendChild(o);o.querySelector("#n_").onclick=()=>{o.remove();res(false)};o.querySelector("#y_").onclick=()=>{o.remove();res(true)}})}
const ST={sap:"Sắp diễn ra",live:"Đang diễn ra",done:"Đã kết thúc"};
let db=null,user=null,dl=null,isOrg=false,cfg={name:"Giải đấu của tôi",sport:"Pickleball",bestOf:3,groups:2,target:11,winBy:2,cap:0,players:[],refs:[],courts:["Sân 1","Sân 2"],rules:"",prizes:""},M=[],tab="live",me="",sel=location.hash.slice(1);
try{me=localStorage.getItem("me")||""}catch(e){}
const lines=t=>String(t||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
const mid=()=>"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const won=m=>{let a=0,b=0;(m.sets||[]).forEach(s=>{if(s[0]>s[1])a++;else if(s[1]>s[0])b++});return[a,b]};
const isRef=()=>cfg.refs.includes(me);
const canScore=m=>isOrg||(isRef()&&m.ref===me);
function setMe(v){me=v;try{localStorage.setItem("me",v)}catch(e){}render()}
function role(){return isOrg?"Ban tổ chức":isRef()?"Trọng tài":cfg.players.includes(me)?"Vận động viên":"Khán giả"}
function tabs(){const t=[["live","📺 Trực tiếp"],["rank","📊 Xếp hạng"],["lich","🗓 Lịch sân"]];if(isOrg||isRef())t.push(["score","🟢 Nhập tỷ số"]);if(isOrg)t.push(["org","⚙️ Ban tổ chức"]);t.push(["info","📜 Thể lệ & Giải thưởng"]);return t}
function render(force){
 $("#tn").textContent=cfg.name;$("#pin").style.display=isOrg?"none":"";$("#role").textContent=role();
 const o=['<option value="">— Tôi là… —</option>'];
 if(cfg.refs.length)o.push("<optgroup label='Trọng tài'>"+cfg.refs.map(r=>`<option ${r===me?"selected":""}>${esc(r)}</option>`).join("")+"</optgroup>");
 if(cfg.players.length)o.push("<optgroup label='Vận động viên'>"+cfg.players.map(r=>`<option ${r===me?"selected":""}>${esc(r)}</option>`).join("")+"</optgroup>");
 if(document.activeElement!==$("#me"))$("#me").innerHTML=o.join("");
 if(!tabs().some(t=>t[0]===tab))tab="live";
 $("#nav").innerHTML=tabs().map(t=>`<button class="${t[0]===tab?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("");
 const a=document.activeElement;if(!force&&a&&$("#app").contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
 $("#app").innerHTML=({live:vLive,rank:vRank,lich:vLich,score:vScore,org:vOrg,info:vInfo})[tab]();
}
const go=t=>{tab=t;sel="";$("#app").innerHTML="";document.activeElement.blur();render()};
function sc(m){const s=m.sets||[];if(!s.length)return"–";return cfg.bestOf>1?`<span class="mu">Set:</span> ${won(m).join(" – ")}`:`${s[0][0]} – ${s[0][1]}`}
function card(m,ctrl){const[w1,w2]=won(m),cur=(m.sets||[]).slice(-1)[0]||[0,0],ln=(m.sets||[]).map(s=>s.join("-")).join(" · ");
 return`<div class="card"><div class="row" style="justify-content:space-between"><span class="mu">${esc(m.label)}</span><span class="st ${m.status}">${m.status==="live"?"● ":""}${ST[m.status]}</span></div>
 <div class="vs"><b style="word-break:break-word">${esc(m.a)}</b><div class="sc">${cfg.bestOf>1?w1+" – "+w2:cur.join(" – ")}</div><b>${esc(m.b)}</b></div>
 ${cfg.bestOf>1?`<div class="mu" style="text-align:center">${esc(ln)}</div>`:""}
 <div class="mu">🏟 ${esc(m.court||"Chưa xếp sân")} · 🧑‍⚖️ ${esc(m.ref||"Chưa có TT")}${m.time?" · 🕒 "+esc(m.time):""}${m.mc?" · 🎙 "+esc(m.mc):""}</div>
 ${ctrl||`<div class="row" style="margin-top:8px"><button class="b o" onclick="share('${m.id}')">🔗 Link</button><button class="b o" onclick="xl('${m.id}')">⬇ Excel</button>${m.stream?`<a href="${esc(m.stream)}" target="_blank" rel="noopener"><button class="b r">▶ Xem trực tiếp</button></a>`:""}</div>`}</div>`}
function vLive(){
 if(!M.length)return`<div class="note">Chưa có trận đấu nào. ${isOrg?"Vào tab ⚙️ Ban tổ chức để nhập danh sách và bốc thăm.":"Vui lòng quay lại khi Ban tổ chức đã bốc thăm."}</div>`;
 const list=sel?M.filter(m=>m.id===sel):M,g=s=>list.filter(m=>m.status===s);
 let h=sel?`<button class="b o" onclick="sel='';location.hash='';render()">← Tất cả trận</button><br><br>`:`<div class="row"><button class="b o" onclick="xlAll()">⬇ Xuất Excel toàn giải</button></div><br>`;
 for(const s of["live","sap","done"])if(g(s).length)h+=`<h2>${s==="live"?"🔴 ":s==="sap"?"⏳ ":"✅ "}${ST[s]} (${g(s).length})</h2><div class="grid">${g(s).map(m=>card(m)).join("")}</div>`;
 return h}
function vScore(){const l=M.filter(canScore);if(!l.length)return`<div class="note">Chưa có trận nào được giao cho bạn. ${isOrg?"":"Hãy chọn tên của bạn ở góc trên bên phải."}</div>`;
 return`<h2>Nhập tỷ số (cập nhật trực tiếp cho mọi người)</h2><div class="mu" style="margin-bottom:8px">${+cfg.target?`Tự kết thúc set khi đạt ${cfg.target} điểm, cách biệt ${cfg.winBy}${+cfg.cap?`, chạm trần ${cfg.cap}`:""}; đủ ${(cfg.bestOf+1)>>1} set thắng thì tự kết thúc trận. Vẫn có nút kết thúc trận thủ công (bỏ cuộc, hết giờ).`:"Chưa bật tự kết thúc theo điểm; trọng tài kết thúc trận thủ công."}</div><div class="grid">${l.map(m=>{const cur=(m.sets||[]).slice(-1)[0]||[0,0],lbl=cfg.bestOf>1?`Set ${(m.sets||[1]).length}`:"Tỷ số";
 const c=m.status==="done"?`<div class="note">Trận đã kết thúc. Người thắng: <b>${esc(m.win)}</b></div><button class="b o" onclick="reopen('${m.id}')">Mở lại trận</button>`:m.status==="sap"?`<button class="b big" onclick="start('${m.id}')">▶ Bắt đầu trận</button>`:
 `<div class="mu" style="text-align:center;margin-bottom:6px">${lbl} · bên nào bấm +1 thì được cộng điểm</div><div class="row" style="flex-wrap:nowrap;align-items:stretch;gap:10px"><div style="flex:1;min-width:0;text-align:center"><div style="font-weight:700;min-height:46px;word-break:break-word;color:#0a7d5a;border-bottom:4px solid #0a7d5a;padding-bottom:4px;margin-bottom:6px">${esc(m.a)}</div><button class="b big" style="background:#0a7d5a;color:#fff" onclick="pt('${m.id}',0,1)">+1</button><button class="b o" style="width:100%;margin-top:6px" onclick="pt('${m.id}',0,-1)">↩ Trừ 1 điểm (sửa nhầm)</button></div><div style="flex:1;min-width:0;text-align:center"><div style="font-weight:700;min-height:46px;word-break:break-word;color:#1a5fb4;border-bottom:4px solid #1a5fb4;padding-bottom:4px;margin-bottom:6px">${esc(m.b)}</div><button class="b big" style="background:#1a5fb4;color:#fff" onclick="pt('${m.id}',1,1)">+1</button><button class="b o" style="width:100%;margin-top:6px;color:#1a5fb4;border-color:#1a5fb4" onclick="pt('${m.id}',1,-1)">↩ Trừ 1 điểm (sửa nhầm)</button></div></div><div class="row" style="margin-top:8px">${cfg.bestOf>1?`<button class="b o" onclick="endSet('${m.id}')">Kết thúc set</button>`:""}<button class="b r" onclick="fin('${m.id}')">🏁 Kết thúc trận</button></div>`;
 return card(m,c)}).join("")}</div>`}
function standings(){const G={};M.filter(m=>m.group).forEach(m=>{G[m.group]=G[m.group]||{};[m.a,m.b].forEach(p=>G[m.group][p]=G[m.group][p]||{p,pl:0,w:0,l:0,d:0})
 if(m.status==="done"){const x=G[m.group][m.a],y=G[m.group][m.b],[a,b]=cfg.bestOf>1?won(m):(m.sets[0]||[0,0]);x.pl++;y.pl++;x.d+=a-b;y.d+=b-a;if(m.win===m.a)x.w++;else if(m.win===m.b)y.w++;if(m.win===m.a)y.l++;else if(m.win===m.b)x.l++}});return G}
function koInfo(){const st={QF:[],SF:[],F:[]};M.filter(m=>m.ko).forEach(m=>{const k=/^Chung/.test(m.label)?"F":/^Bán/.test(m.label)?"SF":/^Tứ/.test(m.label)?"QF":"";if(!k)return;[m.a,m.b].forEach(p=>{if(String(p).indexOf("BYE")<0&&!st[k].includes(p))st[k].push(p)})});const f=M.find(m=>m.ko&&/^Chung/.test(m.label)&&m.status==="done"&&m.win);return{st,champ:f?f.win:"",runner:f?(f.win===f.a?f.b:f.a):""}}
function stg(p){const i=koInfo();return i.champ===p?"🏆 Vô địch":i.runner===p?"🥈 Á quân":i.st.F.includes(p)?"Chung kết":i.st.SF.includes(p)?"Bán kết":i.st.QF.includes(p)?"Tứ kết":"–"}
function koPanel(){const i=koInfo(),st=i.st;if(!st.QF.length&&!st.SF.length&&!st.F.length)return"";
 const chips=a=>a.length?a.map(p=>`<span class="st" style="display:inline-block;margin:2px 4px 2px 0;font-size:13px;color:var(--tx)">${esc(p)}</span>`).join(""):'<span class="mu">Chưa có</span>';
 return`<div class="card"><h2>🏆 Vòng loại trực tiếp</h2>${i.champ?`<div class="note" style="color:var(--tx);margin-bottom:8px;font-size:17px">🏆 <b>Vô địch:</b> ${esc(i.champ)}<br>🥈 <b>Á quân:</b> ${esc(i.runner)}</div>`:`<div class="note" style="margin-bottom:8px">Chưa có đội vô địch.</div>`}<h3>Vào chung kết (${st.F.length})</h3>${chips(st.F)}<h3>Vào bán kết (${st.SF.length})</h3>${chips(st.SF)}<h3>Vào tứ kết (${st.QF.length})</h3>${chips(st.QF)}</div>`}
function vRank(){return koPanel()+vRank0()}
function vRank0(){const G=standings(),k=Object.keys(G).sort();if(!k.length)return`<div class="note">Bảng xếp hạng hiển thị khi giải có thể thức chia bảng vòng tròn. Với loại trực tiếp, xem sơ đồ ở tab Trực tiếp.</div>`;

async function autoOld(quiet){await new Promise(r=>setTimeout(r,1200));

 ex.forEach(m=>{const s=slot(hm(m.time));s.p.add(m.a);s.p.add(m.b);if(m.court)s.c.add(m.court);if(m.ref){s.r.add(m.ref);if(m.ref in load)load[m.ref]++}});
